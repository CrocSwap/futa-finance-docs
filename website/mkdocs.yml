site_name: FUTA Docs
site_description: Public documentation for FUTA, a Solana protocol for launching ticker markets.
# The GitHub Pages address until the docs.futa.finance DNS record is set up;
# restoring the custom domain means changing this and adding docs/CNAME back.
site_url: https://crocswap.github.io/futa-finance-docs/

docs_dir: docs
strict: true
# SUMMARY.md is the navigation source (see hooks/), not a published page.
exclude_docs: |
    SUMMARY.md

theme:
    name: material
    # The FU/TA mark, on the black header bar.
    logo: assets/logo/futa_icon.svg
    favicon: assets/logo/futa_icon.svg
    # Fira Mono is self-hosted from docs/assets/fonts (see stylesheets/extra.css),
    # so Material must not also pull a typeface from Google Fonts.
    font: false
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.sections
        - navigation.indexes
        - navigation.top
        - navigation.footer
        - content.code.copy
        - search.highlight
        - search.suggest
        - toc.follow
        - content.tabs.link
    # Dark only, like the app. One scheme, so Material renders no toggle.
    palette:
        scheme: slate
        primary: custom
        accent: custom

extra_css:
    - stylesheets/extra.css

extra_javascript:
    - javascripts/ai-context.js
    - javascripts/nav-state.js
    - javascripts/bookmarks.js

extra:
    generator: false
    social:
        - icon: fontawesome/solid/terminal
          link: https://futa.finance/
          name: futa.finance
        - icon: fontawesome/brands/x-twitter
          link: https://x.com/futa_finance
          name: '@futa_finance'

copyright: FU/TA — permissionless ticker auctions on Solana

plugins:
    - search

hooks:
    - hooks/nav_from_summary.py
    - hooks/agent_markdown.py
    - hooks/topic_cards.py
    - hooks/permalink_icon.py
    - hooks/last_modified.py

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - tables
    - toc:
          permalink: true
    - pymdownx.details
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.tabbed:
          alternate_style: true
